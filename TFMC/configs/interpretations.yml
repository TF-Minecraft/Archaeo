# Classification station. Each type is one question about this find, not about the site.
# profiles.<id>.types is the station order for that find path.
# Object: Function → Formation → Epoch. Individual / animal: Species → Deposit → Epoch.
# Epoch is declared once and shared. Strata are depth only; they do not state a date.
# suggested-by tags raise a phrase's chance. suggested-for artifact ids guarantee
# at least one matching phrase among the three offers. Neither hides the rest.
# Phrase-level profiles: [individual] / [animal] split species and deposit pools.
# Omit profiles on a phrase to offer it on every path (epoch).
# Phrases are what a field scholar in Cerrith, autumn 379 AE, might write — incomplete, sometimes wrong.
profiles:
  object:
    types: [function, formation, epoch]
  individual:
    types: [species, deposit, epoch]
  animal:
    types: [species, deposit, epoch]

types:
  function:
    display-name: Function
    question: "What work did it do?"
    options:
      combat_edge:
        display-name: "a fighting edge"
        suggested-by: [blade, conflict]
        suggested-for: [imperial_blade]
      working_tool:
        display-name: "a working tool"
        suggested-by: [settlement, domestic]
        suggested-for: [bronze_bit, abyssalite_fitting]
      vessel:
        display-name: "a vessel or offering bowl"
        suggested-by: [ceramic, deposit]
        suggested-for: [offering_bowl, pottery_sherd]
      ornament:
        display-name: "a charm or ornament"
        suggested-by: [ceremonial, ornament, trade]
        suggested-for: [faith_charm, imperial_denar]
      grave_good:
        display-name: "laid to accompany a body"
        suggested-by: [burial, bone]
        suggested-for: [faith_charm, offering_bowl]
      mint_piece:
        display-name: "struck coinage"
        suggested-by: [trade, gold, imperial]
        suggested-for: [imperial_denar]
      rune_work:
        display-name: "rune-work, not a tool"
        suggested-by: [runic, ceremonial, stone]
        suggested-for: [runestone_chip]
      war_kit:
        display-name: "war-kit, not a household"
        suggested-by: [oseni, conflict]
        suggested-for: [war_kit]
      ward_mark:
        display-name: "a ward or gate-mark"
        suggested-by: [dryad, ceremonial, stone]
        suggested-for: [dryad_ward]
      burn_trace:
        display-name: "a hearth or a burning"
        suggested-by: [fire, ash, domestic]
        suggested-for: [hearth_ash, ash_glass]
      unknown_function:
        display-name: "use unknown"
        suggested-by: [unknown]
        suggested-for: [hearth_ash]
  formation:
    display-name: Formation
    question: "How did it come to this band?"
    options:
