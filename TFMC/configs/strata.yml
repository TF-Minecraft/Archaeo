# Order: 1 = top of the cut. depth-* is blocks below the chunk's median ground Y (datum).
# Epoch is a station reading, not a stratum field. These names are the cut as a field camp
# reads it in autumn 379 AE — soil bands, not calendar dates.
strata:
  I:
    order: 1
    display-name: "Overburden"
    depth-min: 0
    depth-max: 4
    always-present: true
  II:
    order: 2
    display-name: "Upper occupation"
    depth-min: 5
    depth-max: 9
    always-present: true
  III:
    order: 3
    display-name: "Lower occupation"
    depth-min: 10
    depth-max: 14
    always-present: true
  IV:
    order: 4
    display-name: "Deep sealed fill"
    depth-min: 15
    depth-max: 19
    always-present: false
