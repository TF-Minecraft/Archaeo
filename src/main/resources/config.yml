# General settings. Catalogs live in the other YAML files.

permissions:
  # Bukkit / LuckPerms node for /archaeo staff commands. Default op via plugin.yml archaeo.admin.
  staff: archaeo.admin

items:
  tracker: RECOVERY_COMPASS
  pick: IRON_PICKAXE
  shovel: IRON_SHOVEL
  hammer: MACE
  brush: BRUSH

tracker:
  enabled: true
  # Radii in blocks. Effective range is the tighter of this cap and the site detection-radius.
  default-max-range: 256
  # Medium band: two pips and two rings. Close band (detect-message-range): three.
  near-range: 48
  # Chat fires when the holder is this close to the site center. Also the three-pip band.
  detect-message-range: 16
  # Extra viewers around the holder (0 = only the scanner). Cooldown is per viewer.
  detect-message-share-range: 0
  pulse-particles: true
  # Ring sizes for the 1 / 2 / 3 pip bursts (far uses the first, close uses all three).
  wave-radii: [1.2, 2.6, 4.2]
  wave-step-ticks: 3
  wave-particle: END_ROD
  # Ring centre offset toward an 8-way heading (blocks). 0 = centred on the player.
  wave-bias-blocks: 1.2
  # Another site must be this many blocks closer before the lock switches.
  target-switch-margin: 16
  # Ticks between bursts: slow at the edge of range, fast next to the chunk.
  beep-max-ticks: 70
  beep-min-ticks: 5
  detect-message-cooldown-ticks: 200
  item-name: "Archaeological tracker"
  item-lore:
    - "Walk. Faster pulses mean closer."
    - "Rings lean toward a heading; they are not a compass."
    - "More pips when you are near. No coordinates."

interest-levels:
  low:
    display-name: "low"
    base-wealth: 1
    variation: 0
    detection-radius: 64
    min-finds: 3
    max-finds: 5
    min-relics: 1
    max-relics: 1
    hint-count: 2
    stratum-iv-chance: 0.0
    disturbed-chance: 0.15
  medium:
    display-name: "medium"
    base-wealth: 3
    variation: 1
    detection-radius: 128
    min-finds: 5
    max-finds: 8
    min-relics: 1
    max-relics: 1
    hint-count: 3
    stratum-iv-chance: 0.25
    disturbed-chance: 0.2
  high:
    display-name: "high"
    base-wealth: 6
    variation: 1
    detection-radius: 256
    min-finds: 8
    max-finds: 12
    min-relics: 1
    max-relics: 2
    hint-count: 3
    stratum-iv-chance: 0.6
    disturbed-chance: 0.25
  exceptional:
    display-name: "exceptional"
    base-wealth: 10
    variation: 2
    detection-radius: 512
    min-finds: 12
    max-finds: 18
    min-relics: 2
    max-relics: 3
    hint-count: 4
    stratum-iv-chance: 1.0
    disturbed-chance: 0.3

generation:
  max-shape-attempts: 24
  grow-vertically: true
  # Extra seed per chunk so shapes are reproducible in the same world.
  use-world-seed: true

shift:
  pick: 8
  hammer: 3
  brush: 10
