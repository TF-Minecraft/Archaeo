# General settings. Catalogs live in the other YAML files.

permissions:
  # Bukkit / LuckPerms node for /archaeo staff commands. Default op via plugin.yml archaeo.admin.
  staff: archaeo.admin

items:
  tracker: RECOVERY_COMPASS
  # Soil probe (cata). Keep this different from items.brush (excavation minigame).
  prospect: STONE_HOE
  # Camp kit. Keep this different from a vanilla stick.
  establish: STICK
  pick: IRON_PICKAXE
  shovel: IRON_SHOVEL
  hammer: MACE
  brush: BRUSH

prospect:
  enabled: true
  # Distinct ground points in the ruin chunk before the site is confirmed.
  points-required: 4
  # Channel time per sample and action-bar duration (20 ticks = 1 second). Moving more than 2 blocks cancels.
  use-ticks: 40
  min-sample-distance: 3
  item-name: "Prospecting kit"
  item-lore:
    - "Right-click several ground points in a suspected chunk."
    - "Confirm the site before you can plant a camp."

establish:
  enabled: true
  # Landmark. Paper 1.21: ARCHAEOLOGY_TABLE. Falls back to lectern if unknown.
  camp-block: ARCHAEOLOGY_TABLE
  # Client-only. Template cells that cannot be planted.
  invalid-block: RED_STAINED_GLASS
  # Client-only. Perimeter of the archaeological chunk (not a full floor tint).
  ruin-outline-block: LIGHT_BLUE_STAINED_GLASS
  item-name: "Establishment kit"
  item-lore:
    - "Aim at the ground next to a confirmed ruin."
    - "The ghost turns red where the camp cannot sit. Right-click to plant."

tracker:
  enabled: true
  # Radii in blocks. Effective range is the tighter of this cap and the site detection-radius.
  default-max-range: 256
  # Medium cone: two pips. Close cone (detect-message-range): three. On-chunk: same three rings, full circle.
  near-range: 64
  # Chat when this close to the site centre and facing it. Also the three-pip cone (outside the chunk).
  detect-message-range: 32
  # Extra viewers around the holder (0 = only the scanner). Cooldown is per viewer.
  detect-message-share-range: 0
  pulse-particles: true
  # Ring sizes for the 1 / 2 / 3 pip bursts (on-chunk reuses the first three as a full circle).
  wave-radii: [1.2, 2.4, 3.6]
  wave-step-ticks: 3
  # Extra ticks after the last ring before the next burst. Lower = snappier; higher = less overlap.
  particle-fade-ticks: 10
  wave-particle: ENCHANTED_HIT
  # Arc centre offset along the look direction (blocks). 0 = centred on the player.
  wave-bias-blocks: 1.2
  # When two ruins are similarly ahead, another must be this many blocks closer to steal the lock.
  target-switch-margin: 16
  # Ticks between bursts: slow at the edge of range, fast next to the chunk.
  beep-max-ticks: 70
  beep-min-ticks: 5
  detect-message-cooldown-ticks: 200
  item-name: "Archaeological tracker"
  item-lore:
    - "Turn. Stronger pulses mean you are facing a ruin."
    - "Arcs fire the way you look. A full ring means you are on it."
    - "No coordinates."

interest-levels:
  low:
    display-name: "low"
    base-wealth: 1
    variation: 0
    detection-radius: 64
    min-finds: 3
    max-finds: 5
    min-relics: 1
    max-relics: 1
    hint-count: 2
    stratum-iv-chance: 0.0
    disturbed-chance: 0.15
  medium:
    display-name: "medium"
    base-wealth: 3
    variation: 1
    detection-radius: 128
    min-finds: 5
    max-finds: 8
    min-relics: 1
    max-relics: 1
    hint-count: 3
    stratum-iv-chance: 0.25
    disturbed-chance: 0.2
  high:
    display-name: "high"
    base-wealth: 6
    variation: 1
    detection-radius: 256
    min-finds: 8
    max-finds: 12
    min-relics: 1
    max-relics: 2
    hint-count: 3
    stratum-iv-chance: 0.6
    disturbed-chance: 0.25
  exceptional:
    display-name: "exceptional"
    base-wealth: 10
    variation: 2
    detection-radius: 512
    min-finds: 12
    max-finds: 18
    min-relics: 2
    max-relics: 3
    hint-count: 4
    stratum-iv-chance: 1.0
    disturbed-chance: 0.3

generation:
  max-shape-attempts: 24
  grow-vertically: true
  # Extra seed per chunk so shapes are reproducible in the same world.
  use-world-seed: true

shift:
  pick: 8
  hammer: 3
  brush: 10
