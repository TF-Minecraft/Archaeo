# Archaeo — gameplay. One section per step the player takes.
#
# Other files (edit those for catalogs, not for tools):
#   interest.yml          how rich a ruin is
#   strata.yml            depth bands
#   artifacts.yml         find templates
#   hints.yml             site clues
#   interpretations.yml   player readings (not used in-game yet)
#   materials.yml         find-material labels (and later lab chains)
#
# Item ids: STONE_HOE | itemsadder:namespace:id | mmoitems:TYPE:id
# Custom pack (MMOItems tools/station, ItemsAdder furniture, models) lives in pack/.
# ItemsAdder: namespace is the pack name (info.namespace in the YAML), not "furniture".
# The item key under items: is the id. Example: itemsadder:archeo:archeology_cabinet
# Quote pack ids so YAML keeps the colons as one string.
# Any matching stack works (crafted, given, or from a pack). Pack items keep the pack look.
# A vanilla id such as STICK matches every vanilla stick, not a custom pack stick.
# Sketch paper/pencil: matching still uses that id, but Archaeo does not rewrite lore on
# unmarked vanilla stacks. Put your own tooltip on a pack item, or /archaeo give paper|pencil.

permissions:
  staff: archaeo.admin

# How rarity tiers appear on pieces (after a field sketch) and camp plaques.
# id = YAML key. label = text shown. color = Bukkit ChatColor name (WHITE, AQUA, GOLD…).
# You can add extra keys (e.g. mythic) and use them as artifacts.yml rarity: overrides.
rarity:
  common:
    label: COMMON
    color: WHITE
  rare:
    label: RARE
    color: BLUE
  epic:
    label: EPIC
    color: DARK_PURPLE
  legendary:
    label: LEGENDARY
    color: GOLD

# When an artifact omits rarity:, display tier comes from its weight (spawn chance).
# Each key is a rarity id; the value is the inclusive max weight for that band.
# Lower max-weight bands are checked first (scarcer finds → rarer label).
# Explicit rarity: on an artifact always wins over these bands.
rarity-from-weight:
  legendary: 4
  epic: 7
  rare: 15
  common: 9999

# 1) Find a hidden ruin
tracker:
  item: RECOVERY_COMPASS
  # item: "mmoitems:TOOL:ARCHAEO_TRACKER"
  enabled: true
  # Hard cap in blocks. Each ruin also has detection-radius in interest.yml; the smaller one wins.
  max-range: 256
  # Pulse strength by distance (weak → strong). Standing on the ruin chunk is always strongest.
  # Chat ("prospect this area") also fires inside close-range when you face the ruin.
  medium-range: 64
  close-range: 32
  pulse-particles: true
  # Ring sizes for the weak / medium / strong pulses.
  wave-radii: [1.2, 2.4, 3.6]
  wave-particle: ENCHANTED_HIT
  # Ticks between pulses: slow far away, fast when close (20 ticks = 1 second).
  beep-max-ticks: 70
  beep-min-ticks: 5

# 2) Confirm it (several ground samples). Only shovel-dug ground counts
# (dirt, grass, sand, gravel, clay, mud). Stations, wool, stone, and other
# furniture are left to vanilla.
prospect:
  item: STONE_HOE
  enabled: true
  points-required: 4
  # 20 ticks = 1 second. Moving more than 2 blocks cancels.
  use-ticks: 40
  min-sample-distance: 3

# 3) Plant the camp on a neighbour chunk
establish:
  item: STICK
  enabled: true
  # Lock every present stratum band. false = vanilla mining still wounds the dossier.
  protect-dig-site: true
  invalid-block: RED_STAINED_GLASS
  ruin-outline-block: LIGHT_BLUE_STAINED_GLASS
  # People on one excavation staff, including the director. The staff board has 18 roster slots
  # (the first two chest rows); there is no second page. Use a smaller number to run a tighter
  # crew. Values above 18 are ignored and treated as 18.
  max-staff: 18
  # Open camps this player may direct at once (established or exhausted). Closing the camp
  # frees a slot so they can claim another ruin. 0 = no cap.
  max-excavations: 1

# 4) Dig the prism, then brush exposed finds
excavation:
  enabled: true
  visual-cues: true
  # How many successful cuts per Minecraft day. 0 = no work-day cap.
  workday-actions: 8
  conservation:
    # What the ground already took, rolled once per find when the site is generated.
    # Digging can only subtract from this, so a flawless dig does not make a flawless piece.
    buried:
      min: 40
      max: 100
      # The roll is centred: a middling piece is common, a pristine one is rare.
      # 1 keeps that curve; >1 leans it toward min (harsher ground).
      bias: 1.0
      # subtracted per stratum step below the top layer (older = worse)
      depth-penalty: 4
      # extra subtraction when that layer is disturbed
      disturbed-penalty: 10
      # materials.yml survival: <0-1> scales the roll (organic rots, stone lasts)
    # How the final number reads on the piece. Highest match wins; below the last band,
    # or at 0%, nothing is recovered.
    grades:
      - id: intact
        min-percent: 92
        label: "Intact"
      - id: sound
        min-percent: 72
        label: "Sound"
      - id: worn
        min-percent: 48
        label: "Worn"
      - id: fragmentary
        min-percent: 24
        label: "Fragmentary"
      - id: crumbling
        min-percent: 1
        label: "Crumbling"
  # "Show limits" on the camp board: the prism drawn for that player only. An established dig
  # no longer answers the tracker, so this (plus the camp) is how the cut is read on the ground.
  # The edges are glowing display bars, not particles: their outline is drawn through terrain,
  # so a spoil heap or a hillside cannot hide the limit.
  limits:
    seconds: 12
    # Bar width in blocks. A thread reads as a line; raise it for a scaffolding look.
    thickness: 0.08
    # Blocks from which the client still renders the bars.
    view-distance: 96
  # Vanilla mining is frozen (the plugin decides when a cube leaves), so tools would never wear
  # unless it is spelled out here. Set a count to 0 to keep that tool pristine for good.
  tool-wear:
    # Durability per cube the pick removes, so a late 3x3x2 lift costs six points, like vanilla.
    pick: 1
    # Durability per cube the brush clears.
    brush: 1
    # Let Unbreaking absorb points, as it would on a normal dig.
    unbreaking: true
  find-particles: true
  find-particles-interval-ticks: 6
  # After a cut, chat + HUD on the empty cube: adjacent find cubes grouped by material (minesweeper).
  neighbor-traces: true
  # Cling / Release tempo — choose per tool with tempo: (see tools below).
  #
  #   tempo: vanilla   OR omit the key
  #     Uses Minecraft mining speed (tool material × block hardness × Efficiency / Haste,
  #     plus any MMOItems block-break-speed already on the player). Soft dirt feels faster
  #     than stone with the same pick; a shovel on sand is quicker than a pick on sand.
  #     hard-blocks / soft-blocks / on-match / on-mismatch are IGNORED in this mode.
  #     Each cling still waits for TWO vanilla break-units (fixed in code), so cues are
  #     slower than breaking the block in survival.
  #
  #   tempo: <ticks>   e.g. tempo: 16
  #     Fixed Archaeo metronome. 20 ticks = 1 second between cling beats BEFORE the same
  #     double-stage cost (so tempo 16 ≈ 1.6 s per cling at on-match 1.0). Higher = slower.
  #     Does NOT use vanilla or MMOItems mining speed. Instead, pick vs shovel (from the
  #     held item, or dig-class:) is checked against hard-blocks / soft-blocks:
  #       matching list  → interval × on-match     (< 1 = faster)
  #       opposite list  → interval × on-mismatch  (> 1 = slower)
  #       neither list   → tempo as written
  #
  # lift-on-ready / lift-if-late / break-shape are independent of tempo: they only decide
  # how many cubes leave when you release on time or late.
  cues:
    # Stone-like fill → faster when tempo is numeric and the tool is a pick. Empty = #mineable/pickaxe.
    hard-blocks:
      # Overworld stone
      - STONE
      - GRANITE
      - DIORITE
      - ANDESITE
      - DEEPSLATE
      - TUFF
      - CALCITE
      - DRIPSTONE_BLOCK
      - COBBLESTONE
      - MOSSY_COBBLESTONE
      - SMOOTH_STONE
      # Sandstone family (deserts / beaches under sand)
      - SANDSTONE
      - RED_SANDSTONE
      - SMOOTH_SANDSTONE
      - SMOOTH_RED_SANDSTONE
      - CUT_SANDSTONE
      - CUT_RED_SANDSTONE
      - CHISELED_SANDSTONE
      - CHISELED_RED_SANDSTONE
      # Ice sheets
      - ICE
      - PACKED_ICE
      - BLUE_ICE
      # Terracotta (badlands)
      - TERRACOTTA
      - WHITE_TERRACOTTA
      - ORANGE_TERRACOTTA
      - MAGENTA_TERRACOTTA
      - LIGHT_BLUE_TERRACOTTA
      - YELLOW_TERRACOTTA
      - LIME_TERRACOTTA
      - PINK_TERRACOTTA
      - GRAY_TERRACOTTA
      - LIGHT_GRAY_TERRACOTTA
      - CYAN_TERRACOTTA
      - PURPLE_TERRACOTTA
      - BLUE_TERRACOTTA
      - BROWN_TERRACOTTA
      - GREEN_TERRACOTTA
      - RED_TERRACOTTA
      - BLACK_TERRACOTTA
      # Packed mud / prismarine / coral (oceans, trails)
      - PACKED_MUD
      - PRISMARINE
      - PRISMARINE_BRICKS
      - DARK_PRISMARINE
      - DEAD_TUBE_CORAL_BLOCK
      - DEAD_BRAIN_CORAL_BLOCK
      - DEAD_BUBBLE_CORAL_BLOCK
      - DEAD_FIRE_CORAL_BLOCK
      - DEAD_HORN_CORAL_BLOCK
      - TUBE_CORAL_BLOCK
      - BRAIN_CORAL_BLOCK
      - BUBBLE_CORAL_BLOCK
      - FIRE_CORAL_BLOCK
      - HORN_CORAL_BLOCK
      # Nether
      - NETHERRACK
      - BASALT
      - SMOOTH_BASALT
      - BLACKSTONE
      - GILDED_BLACKSTONE
      - MAGMA_BLOCK
      - GLOWSTONE
      - BONE_BLOCK
      - ANCIENT_DEBRIS
      # End
      - END_STONE
      - OBSIDIAN
      - CRYING_OBSIDIAN
      # Amethyst geodes
      - AMETHYST_BLOCK
      - BUDDING_AMETHYST
      # Ores (overworld + deepslate + nether)
      - COAL_ORE
      - DEEPSLATE_COAL_ORE
      - IRON_ORE
      - DEEPSLATE_IRON_ORE
      - COPPER_ORE
      - DEEPSLATE_COPPER_ORE
      - GOLD_ORE
      - DEEPSLATE_GOLD_ORE
      - REDSTONE_ORE
      - DEEPSLATE_REDSTONE_ORE
      - LAPIS_ORE
      - DEEPSLATE_LAPIS_ORE
      - DIAMOND_ORE
      - DEEPSLATE_DIAMOND_ORE
      - EMERALD_ORE
      - DEEPSLATE_EMERALD_ORE
      - NETHER_GOLD_ORE
      - NETHER_QUARTZ_ORE
      - RAW_IRON_BLOCK
      - RAW_COPPER_BLOCK
      - RAW_GOLD_BLOCK
    # Soil-like fill → faster when tempo is numeric and the tool is a shovel. Empty = #mineable/shovel.
    soft-blocks:
      - DIRT
      - GRASS_BLOCK
      - PODZOL
      - MYCELIUM
      - COARSE_DIRT
      - ROOTED_DIRT
      - DIRT_PATH
      - FARMLAND
      - MUD
      - MUDDY_MANGROVE_ROOTS
      - CLAY
      - SAND
      - RED_SAND
      - SUSPICIOUS_SAND
      - GRAVEL
      - SUSPICIOUS_GRAVEL
      - SOUL_SAND
      - SOUL_SOIL
      - SNOW_BLOCK
      - MOSS_BLOCK
      - CRIMSON_NYLIUM
      - WARPED_NYLIUM
    # Only used when tempo is a number: multiply if pick/shovel matches hard/soft (< 1 = faster).
    on-match: 0.7
    # Only used when tempo is a number: multiply if pick/shovel is the wrong list (> 1 = slower).
    on-mismatch: 1.35
  # Hold left-click on fill. Cracks stay frozen. First matching tool profile wins.
  # Pick vs shovel class is inferred from the held vanilla material (PICKAXE / SHOVEL tags),
  # or force it with dig-class: pick | shovel | none.
  tools:
    # Bare hand: the aimed cube only, even if you miss the ready window.
    hand:
      items:
        - AIR
      # No tempo key → vanilla mining clock (see cues: comments above).
      dig-class: none
      lift-on-ready: 1
      lift-if-late: 1
      break-shape: down
      workday-cost: 1
      # After Release, this many ticks you can still let go on time (20 = 1 second).
      release-window-ticks: 20
    # Wooden pick / wooden shovel: on time or late, a short shaft.
    light:
      items:
        - WOODEN_PICKAXE
        - WOODEN_SHOVEL
      # Fixed metronome (not vanilla). Scaled by hard/soft lists + on-match / on-mismatch.
      tempo: 16
      lift-on-ready: 1
      lift-if-late: 2
      break-shape: down
      workday-cost: 1
    # Stone pick / shovel: 3×3×2 around the aim (2 cubes on time, 4 if late).
    heavy:
      items:
        - STONE_PICKAXE
        - STONE_SHOVEL
      tempo: 14
      lift-on-ready: 2
      lift-if-late: 4
      break-shape: around
      workday-cost: 1
    super-heavy:
      items:
        - IRON_PICKAXE
        - IRON_SHOVEL
      tempo: 12
      lift-on-ready: 4
      lift-if-late: 8
      break-shape: random
      workday-cost: 1
  brush:
    item: BRUSH
    # item: "itemsadder:archeo:field_brush"
    enabled: true
    # Right-click a dripping cube to start dusting (hold-ticks, 20 = 1 second).
    # Looking away pauses the bar on that cube; looking back with the brush restores it.
    hold-ticks: 40
    progress-bar: true
    max-cells-to-clean: 6

# Field sketch. The sheet is consumed; the pencil wears like a vanilla tool.
# Click the sheet onto the pencil (inventory), or hold the sheet and right-click
# with the pencil in the other hand. Sign the map, then register the drawing at
# the cabinet with the recovered find in hand (right-click the configured block).
# Prefer a unique pack item: that item's pack lore is left alone.
# A vanilla id such as PAPER still matches every paper of that type for the sketch
# gesture, but only /archaeo give paper|pencil writes Archaeo how-to lore (and only
# on those given copies). Ordinary paper and feathers keep a vanilla tooltip.
sketch:
  paper: PAPER
  # paper: "itemsadder:archeo:field_sheet"
  pencil: FEATHER
  # pencil: "mmoitems:TOOL:ARCHAEO_PENCIL"
  # Sketches one pencil survives. 0 = never wears and has no durability bar.
  pencil-uses: 64
  # Vanilla block, or ItemsAdder furniture: "itemsadder:namespace:id"
  # (namespace from the pack YAML info.namespace; id from the items: key).
  # Right-click with a recovered piece in hand: uncleaned opens the lab wipe;
  # cleaned without a drawing opens Register; a filed drawing opens a reading.
  # Empty hand does not open a window. Sneak for vanilla.
  cabinet: CARTOGRAPHY_TABLE
  # First lab step: open this inventory with the piece in hand. Pick a tool from the
  # rack and click each dirty pane. Stain colour, name, and
  # matching tool live here. materials.yml only lists which stains a material may roll
  # and the clean field colour. Tool description and sound apply only to the lab copies
  # in this window, never to water buckets or feathers in the world.
  lab:
    dirty-count: 6
    tools:
      water:
        item: WATER_BUCKET
        display-name: Water
        description: Washes mineral crust from ceramic and stone. Do not soak metal.
        sound: ITEM_BUCKET_EMPTY
      brush:
        item: BRUSH
        display-name: Brush
        description: Dry-cleans rust and soil. Safe on metal and bone.
        sound: ITEM_BRUSH_BRUSHING_GENERIC
      air:
        item: FEATHER
        display-name: Air
        description: Dries mud on organic finds. Do not wet these pieces.
        sound: ITEM_BRUSH_BRUSHING_SAND
    stains:
      limescale:
        display-name: Limescale
        glass: ORANGE_STAINED_GLASS_PANE
        tool: water
      soil:
        display-name: Soil
        glass: BROWN_STAINED_GLASS_PANE
        tool: brush
      rust:
        display-name: Rust
        glass: RED_STAINED_GLASS_PANE
        tool: brush
      mud:
        display-name: Mud
        glass: BROWN_STAINED_GLASS_PANE
        tool: air

# Shift+right-click a recovered find on these supports to open its plaque.
# Vanilla clicks without shift stay Minecraft (hang, rotate, take).
# Quote pack ids: "itemsadder:tfmc:vitrine"
museum:
  displays:
    - ITEM_FRAME
    - GLOW_ITEM_FRAME
    - ARMOR_STAND
    - LECTERN
    - SHELF
    # - ITEM_DISPLAY
    # - "itemsadder:tfmc:display_case"

# Trial: auto-register hidden ruins when chunks load (old or new terrain).
# Each chunk is considered once and remembered under plugins/Archaeo/auto-ruins/evaluated/.
# Staff get a chat line with rarity and a clickable [tp] to the ruin chunk.
# Turn enabled off when you are done testing. Tune chance / distance / max for rarity.
# Use a dot for chance (0.1), not a comma.
# Manual wipe without changing chance: /archaeo ruin auto reset (then re-enter chunks).
auto-ruins:
  enabled: true
  # Empty = every world. Example: [world]
  worlds: []
  # Deterministic share of chunks that attempt a spawn (~1/250 at 0.004).
  # WARNING: changing this value (then /archaeo reload or restart) CLEARS the evaluation
  # ledger so the whole map can re-roll at the new rate. Existing ruin sites are kept;
  # only the “already considered” mask is wiped. Other auto-ruins keys do not trigger that.
  chance-per-chunk: 0.004
  # Chebyshev distance in chunks to any existing site.
  min-chunk-distance: 16
  # Hard cap per world; 0 = no cap.
  max-sites-per-world: 60
  # Skip this many chunks around world spawn.
  exclude-spawn-chunks: 32
  # p90−p10 of a sparse 4×4 surface-height grid (only a few blocks below the heightmap).
  max-relief-blocks: 6
  # Share of those surface samples whose top ground is shovel-mineable (dirt, sand, gravel…).
  min-soil-fraction: 0.35
  # Biome path keys that reject a chunk (centre + four corners at sea level).
  # Use minecraft:ocean or ocean. Empty list = no biome gate. Beaches are not listed on purpose.
  excluded-biomes:
    - ocean
    - deep_ocean
    - warm_ocean
    - lukewarm_ocean
    - deep_lukewarm_ocean
    - cold_ocean
    - deep_cold_ocean
    - frozen_ocean
    - deep_frozen_ocean
    - deep_warm_ocean
    - river
    - frozen_river
  interest-weights:
    low: 50
    medium: 35
    high: 12
    exceptional: 3
  # Wait after chunk load so brand-new terrain can finish populate.
  evaluate-delay-ticks: 20
  # Full fitness checks per server tick (queue drain).
  max-evaluations-per-tick: 1
  notify-staff: true

