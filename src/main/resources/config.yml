# Archaeo — gameplay. One section per step the player takes.
#
# Other files (edit those for catalogs, not for tools):
#   interest.yml          how rich a ruin is
#   strata.yml            depth bands
#   artifacts.yml         find templates
#   hints.yml             site clues
#   interpretations.yml   player readings (not used in-game yet)
#   materials.yml         find-material labels (and later lab chains)
#
# Item ids: STONE_HOE | itemsadder:namespace:id | mmoitems:TYPE:id
# Any matching stack works (crafted, given, or from a pack). Pack items keep the pack look.
# A vanilla id such as STICK matches every vanilla stick, not a custom pack stick.

permissions:
  staff: archaeo.admin

# 1) Find a hidden ruin
tracker:
  item: RECOVERY_COMPASS
  # item: "mmoitems:TOOL:ARCHAEO_TRACKER"
  enabled: true
  # Hard cap in blocks. Each ruin also has detection-radius in interest.yml; the smaller one wins.
  max-range: 256
  # Pulse strength by distance (weak → strong). Standing on the ruin chunk is always strongest.
  # Chat ("prospect this area") also fires inside close-range when you face the ruin.
  medium-range: 64
  close-range: 32
  pulse-particles: true
  # Ring sizes for the weak / medium / strong pulses.
  wave-radii: [1.2, 2.4, 3.6]
  wave-particle: ENCHANTED_HIT
  # Ticks between pulses: slow far away, fast when close (20 ticks = 1 second).
  beep-max-ticks: 70
  beep-min-ticks: 5

# 2) Confirm it (several ground samples)
prospect:
  item: STONE_HOE
  enabled: true
  points-required: 4
  # 20 ticks = 1 second. Moving more than 2 blocks cancels.
  use-ticks: 40
  min-sample-distance: 3

# 3) Plant the camp on a neighbour chunk
establish:
  item: STICK
  enabled: true
  # Lock every present stratum band. false = vanilla mining still wounds the dossier.
  protect-dig-site: true
  invalid-block: RED_STAINED_GLASS
  ruin-outline-block: LIGHT_BLUE_STAINED_GLASS

# 4) Dig the prism, then brush exposed finds
excavation:
  enabled: true
  visual-cues: true
  # How many successful cuts per Minecraft day.
  workday-actions: 8
  # Below this conservation the find is stamped "damaged" (lore / recover chat). The % is always kept.
  damaged-below-percent: 70
  find-particles: true
  find-particles-interval-ticks: 6
  # After a cut, chat + HUD on the empty cube: adjacent find cubes grouped by material (minesweeper).
  neighbor-traces: true
  # Hold left-click on fill. Warning / ready sounds follow vanilla mining speed (tool vs block).
  # Cracks stay frozen. First matching tool wins.
  # How many cubes come out, and in what pattern. Both counts use the same break-shape.
  # The aimed cube is always first. Then:
  #   down    — straight down (Y-1, Y-2, …)
  #   around  — 3×3 on this layer, then 3×3 one block below (includes the cube under the aim)
  #             order: centre, N, E, S, W, then diagonals; then the same on the layer below
  #   random  — same 3×3×2 as around, shuffled (aimed cube still first)
  # lift-on-ready / lift-if-late = how many of those cubes on a timely vs late release.
  tools:
    # Bare hand: the aimed cube only, even if you miss the ready window.
    hand:
      items:
        - AIR
      lift-on-ready: 1
      lift-if-late: 1
      break-shape: down
      workday-cost: 1
      # After the loud Release chime, this many ticks you can still let go and only
      # lift lift-on-ready cubes. Holding longer is late (20 ticks = 1 second).
      release-window-ticks: 20
      # Optional. Omit = cue clock uses the held item as-is: vanilla tool speed
      # (pico vs pala vs bloque) plus whatever MMOItems / ItemsAdder already
      # applied to that stack or the player. These two only replace that sample;
      # they do not rewrite the item in the inventory.
      # mining-speed: 6                  # tool defaultMiningSpeed (iron pick 6, diamond 8)
      # mining-speed-multiplier: 1.0     # scale the full sampled break speed (2.0 = twice as fast)
    # Wooden pick / wooden shovel: on time or late, a short shaft.
    light:
      items:
        - WOODEN_PICKAXE
        - WOODEN_SHOVEL
      lift-on-ready: 1
      lift-if-late: 2
      break-shape: down
      workday-cost: 1
    # Stone pick / shovel: 3×3×2 around the aim (2 cubes on time, 4 if late).
    heavy:
      items:
        - STONE_PICKAXE
        - STONE_SHOVEL
      lift-on-ready: 2
      lift-if-late: 4
      break-shape: around
      workday-cost: 1
    super-heavy:
      items:
        - IRON_PICKAXE
        - IRON_SHOVEL
      lift-on-ready: 4
      lift-if-late: 8
      break-shape: random
      workday-cost: 1
  brush:
    item: BRUSH
    # item: "itemsadder:archeo:field_brush"
    enabled: true
    # Right-click a dripping cube to start dusting (hold-ticks, 20 = 1 second).
    # Looking away pauses the bar on that cube; looking back with the brush restores it.
    hold-ticks: 40
    progress-bar: true
    max-cells-to-clean: 6
