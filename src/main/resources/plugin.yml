name: Archaeo
main: com.nowko.archeology.ArcheologyPlugin
version: 1.0
api-version: "1.21"
author: nowko
description: Persistent archaeology for a custom map.

commands:
  archaeo:
    description: Archaeo admin commands
    usage: /archaeo <ruin|tracker|prospect|establish|pick|find|reload> ...
    # Permission is config.yml permissions.staff (checked in code), default archaeo.admin.

permissions:
  archaeo.admin:
    description: Default staff node; override the name in config.yml permissions.staff
    default: op
