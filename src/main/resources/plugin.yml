name: Archaeo
main: com.nowko.archeology.ArcheologyPlugin
version: 1.0
api-version: "1.21"
author: nowko
description: An archaeology plugin. Hidden ruins you track by ear, a camp beside the cut, and finds you can break as easily as recover.

softdepend:
  - ItemsAdder
  - MMOItems

commands:
  archaeo:
    description: Archaeo admin commands
    usage: /archaeo <give|ruin|workday|find|sketch|reload> ...
    # Permission is config.yml permissions.staff (checked in code), default archaeo.admin.

permissions:
  archaeo.admin:
    description: Default staff node; override the name in config.yml permissions.staff
    default: op
