# Find templates. size-* = connected cells. relic = counts toward the relic quota
# (unused in the default pack: every find is a liftable object).
# profile = object | individual | animal (omit for object). That path picks the
# station questions; species is signed there, not named here.
# weight = relative spawn chance (higher = more common in generation).
# rarity = optional display override (key under config.yml rarity:). If omitted,
# display tier is derived from weight via config.yml rarity-from-weight.
# Example override: rarity: legendary (forces LEGENDARY even if weight is high).
# study-notes are revealed at camp after the piece is studied; they do not show on lift.
artifacts:
  coin:
    display-name: Coin
    size-min: 1
    size-max: 1
    material: metal
    relic: false
    weight: 22
    strata: [I, II, III]
    tags: [trade, metal]
    item: GOLD_NUGGET
    study-notes: "A small struck disc. The face is worn; a mint or a portrait may still be read."
  pottery_sherd:
    display-name: Pottery sherd
    size-min: 1
    size-max: 1
    material: ceramic
    relic: false
    weight: 24
    strata: [I, II, III, IV]
    tags: [ceramic, settlement]
    item: BRICK
    study-notes: "A body sherd. The fabric and any surviving slip say more than the shape."
  tool:
    display-name: Tool
    size-min: 2
    size-max: 3
    material: metal
    relic: false
    weight: 14
    strata: [II, III]
    tags: [settlement, metal]
    item: IRON_HOE
    study-notes: "A working edge, not an ornament. Wear on the bit points to repeated use."
  sword:
    display-name: Ancient sword
    size-min: 3
    size-max: 5
    material: metal
    relic: false
    weight: 6
    strata: [II, III, IV]
    tags: [conflict, metal, blade]
    item: IRON_SWORD
    study-notes: "A blade with little domestic assemblage around it. The fuller and tang still read as a weapon."
  vessel:
    display-name: Vessel
    size-min: 3
    size-max: 6
    material: ceramic
    relic: false
    weight: 10
    strata: [I, II, III]
    tags: [ceramic, ceremonial, deposit]
    item: DECORATED_POT
    study-notes: "A closed form. Surviving rim and decoration suggest it was set down, not discarded in pieces."
  burial:
    display-name: Burial
    profile: individual
    size-min: 8
    size-max: 15
    material: bone
    # Optional override example — same tier weight would already pick; kept to document the key.
    rarity: legendary
    relic: false
    weight: 4
    strata: [III, IV]
    tags: [burial, bone]
    item: BONE
    study-notes: "Articulated bone, not kitchen scatter. The layout still argues for a grave."
  faunal_dump:
    display-name: Animal remains
    profile: animal
    size-min: 3
    size-max: 8
    material: bone
    relic: false
    weight: 10
    strata: [I, II, III]
    tags: [bone, food, animal]
    item: BONE
    study-notes: "Disarticulated bone with kitchen scatter. This looks like refuse, not a grave."
  charcoal:
    display-name: Fire remains
    size-min: 1
    size-max: 2
    material: organic
    relic: false
    weight: 16
    strata: [I, II, III]
    tags: [fire, domestic]
    item: CHARCOAL
    study-notes: "Charred wood and ash. Repeated burning at this depth looks domestic, not a single pyre."
  ornament:
    display-name: Ornament
    size-min: 1
    size-max: 2
    material: metal
    relic: false
    weight: 8
    strata: [II, III]
    tags: [ceremonial, trade, ornament]
    item: GOLD_INGOT
    study-notes: "A small decorative piece. The metal does not match the cheapest local work."
