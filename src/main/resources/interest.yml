# How rich a staff-registered ruin is. Established sites keep the dossier they already have.
# Relic quotas stay at 0 until a later pack marks templates as relic (architecture, etc.).
#
# detection-radius (blocks): optional per-tier tracker range written onto the site at creation.
# If you omit it on a tier, Archaeo uses tracker.max-range from config.yml for that tier.
# The tracker still applies max-range as a hard cap: effective range = min(site radius, max-range).

interest-levels:
  low:
    display-name: "low"
    base-wealth: 1
    variation: 0
    detection-radius: 64
    min-finds: 3
    max-finds: 5
    min-relics: 0
    max-relics: 0
    hint-count: 2
    stratum-iv-chance: 0.0
    disturbed-chance: 0.15
  medium:
    display-name: "medium"
    base-wealth: 3
    variation: 1
    detection-radius: 128
    min-finds: 5
    max-finds: 8
    min-relics: 0
    max-relics: 0
    hint-count: 3
    stratum-iv-chance: 0.25
    disturbed-chance: 0.2
  high:
    display-name: "high"
    base-wealth: 6
    variation: 1
    detection-radius: 256
    min-finds: 8
    max-finds: 12
    min-relics: 0
    max-relics: 0
    hint-count: 3
    stratum-iv-chance: 0.6
    disturbed-chance: 0.25
  exceptional:
    display-name: "exceptional"
    base-wealth: 10
    variation: 2
    detection-radius: 512
    min-finds: 12
    max-finds: 18
    min-relics: 0
    max-relics: 0
    hint-count: 4
    stratum-iv-chance: 1.0
    disturbed-chance: 0.3

# Shape placement when a ruin is created
generation:
  max-shape-attempts: 24
  use-world-seed: true
  # Fill blocks that must sit on top of every cell of a find. Stratum bands are measured from the
  # chunk's median ground level, so on a slope or a shore the band itself reaches open air: this is
  # what keeps a piece from being generated in plain sight. Raise it to bury finds deeper.
  find-min-cover: 2
