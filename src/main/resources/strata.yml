# Order: 1 = top of the cut. depth-* is blocks below the chunk's median ground Y (datum).
# Epoch is a station reading, not a stratum field.
strata:
  I:
    order: 1
    display-name: "Recent layer"
    depth-min: 0
    depth-max: 4
    always-present: true
  II:
    order: 2
    display-name: "Layer II"
    depth-min: 5
    depth-max: 9
    always-present: true
  III:
    order: 3
    display-name: "Layer III"
    depth-min: 10
    depth-max: 14
    always-present: true
  IV:
    order: 4
    display-name: "Deep layer"
    depth-min: 15
    depth-max: 19
    always-present: false
